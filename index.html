<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Mock — Skeleton</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>Mock Health Record</h1>
    <p class="sub">Skeleton build — proves the plumbing works.</p>

    <label for="patientName">Patient name</label>
    <input type="text" id="patientName" placeholder="Type the patient's name" />

    <button id="saveBtn">Save assessment</button>

    <hr />

    <p id="count">Saved assessments on this device: 0</p>
    <button id="exportBtn">Export all as CSV</button>
    <button id="clearBtn" class="danger">Clear all (careful)</button>

    <p id="status" class="status"></p>
  </main>

  <!-- Local-storage helper (tiny, well-known library) -->
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
