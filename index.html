<!DOCTYPE html>
<!--
  index.html — the single page of the app.

  This is the app's entry point. GitHub Pages serves this file as the
  homepage. It must stay at the project root.

  The page is intentionally minimal in this skeleton: one input field,
  a save button, and controls for exporting/clearing locally-stored
  assessments. Real UWIN-like fields and the mock patient case will be
  added here as the project grows.

  Load order matters at the bottom of <body>:
    1. localforage  — the local-storage helper library (from a CDN)
    2. js/app.js     — our own logic, which depends on localforage
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the layout scale correctly on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Competency App — Mock Health Record</title>

  <!-- PWA manifest: enables "Add to Home Screen" and offline install. -->
  <link rel="manifest" href="manifest.json" />
  <!-- Browser UI colour on mobile (address bar tint). -->
  <meta name="theme-color" content="#2563eb" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <h1>Mock Health Record</h1>
    <p class="sub">Skeleton build — proves the plumbing works.</p>

    <!-- ============ ASSESSMENT FORM ============ -->
    <!-- Each real UWIN-like field will follow this label+input pattern. -->
    <label for="patientName">Patient name</label>
    <input type="text" id="patientName" placeholder="Type the patient's name" />

    <button id="saveBtn">Save assessment</button>

    <hr />

    <!-- ============ DATA MANAGEMENT ============ -->
    <!-- These controls are for the interviewer, not the health worker. -->
    <p id="count">Saved assessments on this device: 0</p>
    <button id="exportBtn">Export all as CSV</button>
    <button id="clearBtn" class="danger">Clear all (careful)</button>

    <!-- Transient feedback messages ("Saved.", "Exported 3...") appear here. -->
    <p id="status" class="status"></p>
  </main>

  <!--
    localforage: a small, well-known library that stores data in the
    browser's IndexedDB. IndexedDB survives page reloads, browser
    restarts, and phone reboots, and works with no internet connection.
    Loaded from a CDN, but also cached by the service worker so it
    remains available offline after the first visit.
  -->
  <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>

  <!-- Our application logic. Must load after localforage. -->
  <script src="js/app.js"></script>
</body>
</html>
